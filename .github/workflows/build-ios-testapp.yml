# Produces UNSIGNED artifacts (CODE_SIGNING_ALLOWED=NO); re-sign the .ipa before installing it on a device.
name: Build iOS TestApp

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "iphoneos = device (unsigned .ipa), iphonesimulator = simulator (.app.zip)"
        type: choice
        options:
          - iphoneos
          - iphonesimulator
        default: iphoneos
      configuration:
        description: "Xcode build configuration (also selects the Kotlin build type)"
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  push:
    paths:
      - ".github/workflows/build-ios-testapp.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.sdk || 'iphoneos' }} (${{ inputs.configuration || 'Debug' }})
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SDK: ${{ inputs.sdk || 'iphoneos' }}
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      # Empty = image default; Xcode 26.0.1/26.1.1 lack their iOS platform there (runner-images#14146).
      XCODE_VERSION: ""
      IOS_APP_DIR: samples/testapp/iosApp
      # Override with repository variables once the app is signed with your own Apple Developer account.
      LOCAL_BUNDLE_ID: ${{ vars.LOCAL_BUNDLE_ID || 'org.multipaz.testapp' }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID || 'group.org.multipaz.testapp.sharedgroup' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # build.gradle.kts derives versionCode from the commit count.
          fetch-depth: 0
          fetch-tags: true

      # build.gradle.kts runs `git rev-list <projectVersionLast>..`, and forks do not carry upstream's release tags.
      - name: Fetch upstream tags
        run: git fetch --no-tags https://github.com/openwallet-foundation/multipaz.git '+refs/tags/*:refs/tags/*'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version

      - name: Prepare
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          printf '%s\n' \
            "DEVELOPMENT_TEAM =" \
            "LOCAL_BUNDLE_ID = $LOCAL_BUNDLE_ID" \
            "APP_GROUP_ID = $APP_GROUP_ID" \
            > "$IOS_APP_DIR/DeveloperConfig.xcconfig"

      # The "Compile Kotlin Framework" build phase runs Gradle (embedAndSignAppleFrameworkForXcode).
      - name: Build
        run: |
          case "$SDK" in
            iphoneos) destination="generic/platform=iOS" ;;
            *) destination="generic/platform=iOS Simulator" ;;
          esac
          xcodebuild build \
            -project "$IOS_APP_DIR/TestApp.xcodeproj" \
            -scheme TestApp \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "$destination" \
            -derivedDataPath build/xcode-derived-data \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package
        run: |
          shopt -s nullglob
          products="build/xcode-derived-data/Build/Products/${CONFIGURATION}-${SDK}"
          apps=("$products"/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::No .app found in $products"
            ls -la "$products" || true
            exit 1
          fi
          mkdir dist
          if [ "$SDK" = "iphoneos" ]; then
            mkdir dist/Payload
            cp -R "${apps[0]}" dist/Payload/
            (cd dist && zip -qry "TestApp-${CONFIGURATION}-unsigned.ipa" Payload && rm -rf Payload)
          else
            ditto -c -k --keepParent "${apps[0]}" "dist/TestApp-${CONFIGURATION}-simulator.app.zip"
          fi
          ls -lh dist

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: TestApp-${{ env.SDK }}-${{ env.CONFIGURATION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
