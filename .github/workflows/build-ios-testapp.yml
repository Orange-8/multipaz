# Produces UNSIGNED artifacts (CODE_SIGNING_ALLOWED=NO); re-sign the .ipa before installing it on a device.
name: Build iOS TestApp

on:
  workflow_dispatch:
    inputs:
      sdk:
        description: "iphoneos = device (unsigned .ipa), iphonesimulator = simulator (.app.zip)"
        type: choice
        options:
          - iphoneos
          - iphonesimulator
        default: iphoneos
      configuration:
        description: "Xcode build configuration (also selects the Kotlin build type)"
        type: choice
        options:
          - Debug
          - Release
        default: Debug
  push:
    paths:
      - ".github/workflows/build-ios-testapp.yml"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ inputs.sdk || 'iphoneos' }} (${{ inputs.configuration || 'Debug' }})
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SDK: ${{ inputs.sdk || 'iphoneos' }}
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}
      # Empty = image default; Xcode 26.0.1/26.1.1 lack their iOS platform there (runner-images#14146).
      XCODE_VERSION: ""
      IOS_APP_DIR: samples/testapp/iosApp
      # Override with repository variables once the app is signed with your own Apple Developer account.
      LOCAL_BUNDLE_ID: ${{ vars.LOCAL_BUNDLE_ID || 'org.multipaz.testapp' }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID || 'group.org.multipaz.testapp.sharedgroup' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # build.gradle.kts derives versionCode from the commit count.
          fetch-depth: 0
          fetch-tags: true

      # build.gradle.kts runs `git rev-list <projectVersionLast>..`, and forks do not carry upstream's release tags.
      - name: Fetch upstream tags
        run: git fetch --no-tags https://github.com/openwallet-foundation/multipaz.git '+refs/tags/*:refs/tags/*'

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Select Xcode
        run: |
          if [ -n "$XCODE_VERSION" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          fi
          xcodebuild -version

      - name: Prepare
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          printf '%s\n' \
            "DEVELOPMENT_TEAM =" \
            "LOCAL_BUNDLE_ID = $LOCAL_BUNDLE_ID" \
            "APP_GROUP_ID = $APP_GROUP_ID" \
            > "$IOS_APP_DIR/DeveloperConfig.xcconfig"

      # Gradle runs here first because the nested SwiftBridge xcodebuild crashed when started from Xcode's script phase.
      - name: Build Kotlin framework
        run: |
          case "$SDK" in
            iphoneos) target=IosArm64 ;;
            *) target=IosSimulatorArm64 ;;
          esac
          ./gradlew ":samples:testapp:link${CONFIGURATION}Framework${target}" 2>&1 | tee gradle.log
          # Free the daemon's memory before Xcode starts its own Gradle.
          ./gradlew --stop

      # In Xcode's "Compile Kotlin Framework" phase the nested SwiftBridge xcodebuild crashes and re-runs anyway; skip it there.
      - name: Build
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/skip-swiftbridge-in-xcode.gradle <<'EOF'
          if (System.getenv('SDK_NAME')) {
              allprojects {
                  if (path == ':multipaz:SwiftBridge') {
                      tasks.configureEach {
                          if (name in ['buildIphoneos', 'buildIphonesimulator']) {
                              enabled = false
                          }
                      }
                  }
              }
          }
          EOF
          case "$SDK" in
            iphoneos) destination="generic/platform=iOS" ;;
            *) destination="generic/platform=iOS Simulator" ;;
          esac
          xcodebuild build \
            -project "$IOS_APP_DIR/TestApp.xcodeproj" \
            -scheme TestApp \
            -configuration "$CONFIGURATION" \
            -sdk "$SDK" \
            -destination "$destination" \
            -derivedDataPath build/xcode-derived-data \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log

      - name: Package
        run: |
          shopt -s nullglob
          products="build/xcode-derived-data/Build/Products/${CONFIGURATION}-${SDK}"
          apps=("$products"/*.app)
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::No .app found in $products"
            ls -la "$products" || true
            exit 1
          fi
          mkdir dist
          if [ "$SDK" = "iphoneos" ]; then
            mkdir dist/Payload
            cp -R "${apps[0]}" dist/Payload/
            (cd dist && zip -qry "TestApp-${CONFIGURATION}-unsigned.ipa" Payload && rm -rf Payload)
          else
            ditto -c -k --keepParent "${apps[0]}" "dist/TestApp-${CONFIGURATION}-simulator.app.zip"
          fi
          ls -lh dist

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: TestApp-${{ env.SDK }}-${{ env.CONFIGURATION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      # Job logs need a GitHub login to read, annotations do not.
      - name: Report failure
        if: failure()
        run: |
          annotate() {
            [ -n "$3" ] || return 0
            echo "::$1 title=$2::$(printf '%s' "$3" | perl -0pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
          }
          annotate notice Environment "$(xcodebuild -version | tr '\n' ' ') $(java -version 2>&1 | head -n 1) RAM=$(( $(sysctl -n hw.memsize) / 1073741824 ))GB free=$(df -h / | awk 'NR==2 {print $4}')"
          annotate notice "Git status" "$(git status --porcelain | head -n 30)"
          if [ -f xcodebuild.log ]; then log=xcodebuild.log; elif [ -f gradle.log ]; then log=gradle.log; else exit 0; fi
          annotate error Errors "$(grep -E '^e: |error:|FAILURE:|BUILD FAILED|Execution failed|Caused by|OutOfMemory|disappeared' "$log" | cut -c1-300 | awk '!seen[$0]++' | head -n 25 | head -c 3800)"
          annotate error Gradle "$(sed -n '/\* What went wrong:/,/\* Try:/p' "$log" | cut -c1-300 | head -n 25 | head -c 3800)"
          tail -c 10500 "$log" | split -b 3500 - "$RUNNER_TEMP/tail_"
          for f in "$RUNNER_TEMP"/tail_*; do annotate warning "Log tail" "$(cat "$f")"; done
          annotate warning "Gradle daemon" "$(find ~/.gradle/daemon -name 'daemon-*.out.log' -exec tail -q -n 25 {} + 2>/dev/null | cut -c1-300 | tail -c 3800)"
